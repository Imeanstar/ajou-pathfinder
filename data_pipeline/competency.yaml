# 역량 온톨로지 — 16개 항목(기술 13 + 도메인 3), 역할 트랙 8개, 산업 오버레이 3개,
# 대학원 연구실 클러스터 5개.
# 확정: 2026-08-20 (역할 8개+산업 오버레이+대학원 클러스터로 개정, 이전 7개 트랙에서 갈아엎음).
# 근거·설계 논의는 docs/주제기획서.md 4-2~4-3 참고. 요람 원문 "졸업 후 진로"
# (프로그래머·SW디자이너·SW아키텍트·시스템 엔지니어·통신 전문가 / 금융·자동차·공공기관 진출
# / 대학원 진학 / 창업) 문구를 반영해 개정.
#
# 사용법:
#   - 과목·프로그램·개인 프로젝트는 이 16개 중 1~3개를 태그로 받는다 (data_pipeline/03_tag_competency.py)
#   - 사용자의 "현재 역량 벡터" = 이수 과목 태그 합산(가중치 1.0) + 자기신고 프로젝트/비교과 태그 합산(가중치 0.5)
#   - 1차 선택: tracks(역할, 필수 8개 중 1개) — "어떤 기술을 기를지"
#   - 2차 선택(선택): domain_overlays(산업, 0~1개) — 역할 위에 도메인 지식을 얹음
#   - 대학원_연구 트랙을 고르면 grad_lab_clusters(연구실 클러스터, 0~1개)로 더 세분화
#   - 격차 = 목표(트랙 + 오버레이/클러스터 가중치 병합) - 현재, 격차가 큰 순으로 추천에 반영

